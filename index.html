<style>
:root{--p:#0284c7;--pd:#0c4a6e;--pk:#0ea5e9;--pl:#e0f2fe;--bg:#f0f9ff;--tx:#082f49}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(135deg,#e0f2fe,#f8fbff);color:var(--tx);min-height:100vh}
h1.brand{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:clamp(26px,5vw,44px);margin:0;background:linear-gradient(90deg,var(--p),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;line-height:1.2}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(2,132,199,.16);margin-bottom:18px}
.login{max-width:380px;margin:40px auto}
input,select,textarea{width:100%;padding:11px 14px;border:2px solid #bae6fd;border-radius:12px;font:inherit;margin:6px 0 12px;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pk)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--p),var(--pk));transition:.15s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(8,145,178,.35)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.b-h{background:#16a34a}.b-i{background:#f59e0b}.b-a{background:#dc2626}.b-g{background:#38bdf8}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--pl);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--pd)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #e0f2fe;padding:6px;text-align:center}
th{background:linear-gradient(90deg,var(--p),var(--pk));color:#fff}
td.name{text-align:left;font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
.c{display:inline-block;min-width:22px;border-radius:6px;font-weight:600;padding:2px 4px}
.cH{background:#dcfce7;color:#166534}.cI{background:#fef3c7;color:#92400e}.cA{background:#fee2e2;color:#991b1b}
.off{background:#f3f4f6;color:#9ca3af}.sat{background:#f0f9ff}
.edit{cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--pl);color:var(--pd)}.tabs button.on{background:linear-gradient(90deg,var(--p),var(--pk));color:#fff}
.note{font-size:12px;opacity:.75}
.modal{position:fixed;inset:0;background:rgba(8,47,73,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.show{display:flex}
.pop{background:#fff;border-radius:26px;padding:26px;max-width:340px;text-align:center;animation:bounce .5s;border:4px solid var(--pk)}
.pop h3{margin:8px 0 4px;color:var(--pd)}
@keyframes bounce{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.float{animation:fl 2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.printhead{display:none}
@media print{
 body{background:#fff}.noprint,.top button,.tabs,.modal{display:none!important}
 .card{box-shadow:none;border:0;padding:0}.printhead{display:block}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.hero{position:relative;background:linear-gradient(135deg,#0c4a6e,#0284c7 55%,#0ea5e9);text-align:center;padding:34px 16px 0;color:#fff;overflow:hidden}
.hero .brand{background:none;-webkit-text-fill-color:#fff;color:#fff;text-shadow:0 2px 8px rgba(8,47,73,.45);letter-spacing:.5px}
.hero p{margin:6px 0 0;font-size:15px;letter-spacing:3px;text-transform:uppercase;opacity:.9}
.wv{display:block;width:100%;height:80px;margin-top:10px}
.par>use{animation:move 26s cubic-bezier(.55,.5,.45,.5) infinite}
.par>use:nth-child(1){animation-delay:-2s;animation-duration:8s}
.par>use:nth-child(2){animation-delay:-3s;animation-duration:12s}
.par>use:nth-child(3){animation-delay:-4s;animation-duration:17s}
.par>use:nth-child(4){animation-delay:-5s;animation-duration:26s}
@keyframes move{0%{transform:translate3d(-90px,0,0)}100%{transform:translate3d(85px,0,0)}}
@media(prefers-reduced-motion:reduce){.par>use{animation:none}}
.wrap{padding-top:8px}

.splash{position:fixed;inset:0;z-index:30;background:linear-gradient(135deg,#0c4a6e,#0284c7 55%,#0ea5e9);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;transition:opacity .7s,visibility .7s}
.splash.hide{opacity:0;visibility:hidden}
.splash h2{font-size:clamp(22px,5vw,36px);margin:14px 0 4px;font-weight:700}
.splash p{margin:0 0 16px;opacity:.9;letter-spacing:2px;text-transform:uppercase;font-size:13px}
.splash svg{width:min(360px,86vw);height:auto;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.sbar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 2.6s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.scoin{animation:fall 2.8s ease-in infinite}
@keyframes fall{0%{transform:translateY(0);opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translateY(170px);opacity:0}}
.scalc{animation:sway 3s ease-in-out infinite;transform-origin:162px 210px}
@keyframes sway{50%{transform:rotate(2.5deg) translateY(-4px)}}
.spen{animation:write 2s ease-in-out infinite}
@keyframes write{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,10px)}}
.splash button{background:#fff;color:#0c4a6e;padding:11px 30px;font-size:16px}
@media(prefers-reduced-motion:reduce){.sbar,.scoin,.scalc,.spen{animation:none}}
@media print{.splash{display:none!important}}

.hero{background:linear-gradient(160deg,#7dd3fc,#bae6fd 60%,#e0f2fe);color:#0c4a6e}
.hero .brand{-webkit-text-fill-color:#0c4a6e;color:#0c4a6e;text-shadow:0 2px 6px rgba(255,255,255,.8)}
.hero h1,.hero p{position:relative;z-index:1}
.cloud{position:absolute;width:90px;height:26px;background:#fff;border-radius:30px;opacity:.9;animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:36px;height:36px;top:-17px;left:14px}
.cloud::after{width:48px;height:48px;top:-25px;left:36px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.splash{background:linear-gradient(160deg,#7dd3fc,#e0f2fe);color:#0c4a6e}
.splash button{background:#0284c7;color:#fff}
.lg{display:block;margin:0 auto 6px;width:min(330px,92%);height:auto}
@media(prefers-reduced-motion:reduce){.cloud{animation:none}}
@media print{.cloud{display:none}}
</style>
</head>

<script>
// ===== DATA AKUN (ganti password di sini) =====
const USERS={
 aldinda:{name:'Aldinda',pw:'aldindajay',admin:true},
 nazwa:{name:'Nazwa',pw:'nazwa123'},
 nafisa:{name:'Nafisa',pw:'nafisa123'}
};
const KEY='absen_kap_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"att":{}}');
let me=sessionStorage.getItem('me');
let period=new Date().toISOString().slice(0,7);
let view='me';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const label=p=>{const[y,m]=p.split('-');return MONTHS[+m-1]+' '+y};
function days(p){const[y,m]=p.split('-').map(Number);const n=new Date(y,m,0).getDate();
 return Array.from({length:n},(_,i)=>{const d=i+1;return{d,key:`${p}-${pad(d)}`,dow:new Date(y,m-1,d).getDay()}})}
const rec=(u,k)=>(db.att[u]||{})[k];
function setRec(u,k,s,ket){db.att[u]=db.att[u]||{};
 if(!s){delete db.att[u][k]}else db.att[u][k]={s,k:ket||'',t:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};save()}
function totals(u,p){let H=0,I=0,A=0,S=0,W=0;
 days(p).forEach(x=>{if(x.dow>0&&x.dow<6)W++;const r=rec(u,x.key);if(!r)return;
  if(r.s=='H'){H++;if(x.dow==6)S++}else if(r.s=='I')I++;else if(r.s=='A')A++});
 return{H,I,A,S,W}}

// ===== POP UP LUCU =====
const ART={
calc:`<svg class="float" width="120" height="120" viewBox="0 0 120 120"><rect x="25" y="14" width="70" height="92" rx="12" fill="#0284c7"/><rect x="34" y="24" width="52" height="22" rx="6" fill="#cffafe"/><text x="80" y="42" font-size="16" text-anchor="end" fill="#0c4a6e" font-weight="700">1.000</text><g fill="#0ea5e9"><circle cx="44" cy="62" r="6"/><circle cx="60" cy="62" r="6"/><circle cx="76" cy="62" r="6"/><circle cx="44" cy="80" r="6"/><circle cx="60" cy="80" r="6"/><circle cx="76" cy="80" r="6"/></g><circle cx="52" cy="96" r="3" fill="#fff"/><circle cx="68" cy="96" r="3" fill="#fff"/><path d="M54 99q6 5 12 0" stroke="#fff" stroke-width="2" fill="none"/></svg>`,
coin:`<svg class="float" width="120" height="120" viewBox="0 0 120 120"><ellipse cx="60" cy="96" rx="38" ry="10" fill="#f59e0b"/><rect x="22" y="70" width="76" height="26" fill="#fbbf24"/><ellipse cx="60" cy="70" rx="38" ry="10" fill="#fde68a"/><ellipse cx="60" cy="48" rx="30" ry="9" fill="#f59e0b"/><rect x="30" y="30" width="60" height="18" fill="#fbbf24"/><ellipse cx="60" cy="30" rx="30" ry="9" fill="#fde68a"/><text x="60" y="36" font-size="14" text-anchor="middle" fill="#b45309" font-weight="700">$</text><circle cx="50" cy="82" r="2.5" fill="#92400e"/><circle cx="70" cy="82" r="2.5" fill="#92400e"/><path d="M53 87q7 5 14 0" stroke="#92400e" stroke-width="2" fill="none"/></svg>`,
book:`<svg class="float" width="120" height="120" viewBox="0 0 120 120"><rect x="20" y="22" width="80" height="80" rx="8" fill="#0ea5e9"/><rect x="28" y="22" width="68" height="76" rx="4" fill="#fff"/><g stroke="#bae6fd" stroke-width="2"><path d="M36 40h52M36 54h52M36 68h52M36 82h52M60 30v62"/></g><text x="48" y="50" font-size="12" fill="#dc2626" font-weight="700">-0</text><circle cx="78" cy="76" r="9" fill="#fecaca"/><path d="M73 79q5-5 10 0M74 73h1M82 73h1" stroke="#dc2626" stroke-width="2" fill="none"/></svg>`,
pen:`<svg class="float" width="120" height="120" viewBox="0 0 120 120"><rect x="22" y="30" width="76" height="62" rx="8" fill="#38bdf8"/><rect x="30" y="38" width="60" height="46" rx="4" fill="#fff"/><path d="M38 50h30M38 62h44M38 74h20" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/><path d="M86 20l14 14-26 26-18 4 4-18z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/></svg>`};
function popup(art,title,msg){$('pop').innerHTML=ART[art]+`<h3>${title}</h3><p style="margin:6px 0 14px">${msg}</p><button onclick="closePop()">Siap! ✨</button>`;$('modal').classList.add('show')}
function closePop(){$('modal').classList.remove('show')}
$('modal').onclick=e=>{if(e.target.id=='modal')closePop()};

// ===== LOGIN =====
function loginPage(){
 $('app').innerHTML=`<div class="card login"><svg class="lg" viewBox="0 0 330 140" aria-hidden="true">
 <g class="float" style="animation-delay:0s"><g transform="translate(10,20)"><rect width="64" height="104" rx="12" fill="#0284c7"/><rect x="8" y="8" width="48" height="20" rx="5" fill="#e0f2fe"/><text x="52" y="24" font-size="13" text-anchor="end" fill="#0c4a6e" font-weight="700">1.250</text><circle cx="22" cy="46" r="3.5" fill="#fff"/><circle cx="42" cy="46" r="3.5" fill="#fff"/><path d="M26 54q6 7 12 0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="14" cy="53" r="4" fill="#fda4af" opacity=".85"/><circle cx="50" cy="53" r="4" fill="#fda4af" opacity=".85"/><g fill="#7dd3fc"><circle cx="16" cy="76" r="5"/><circle cx="32" cy="76" r="5"/><circle cx="48" cy="76" r="5"/><circle cx="16" cy="92" r="5"/><circle cx="32" cy="92" r="5"/></g><circle cx="48" cy="92" r="5" fill="#fbbf24"/></g></g>
 <g class="float" style="animation-delay:.5s"><g transform="translate(96,40)"><circle cx="36" cy="40" r="36" fill="#fbbf24" stroke="#d97706" stroke-width="3"/><circle cx="36" cy="40" r="28" fill="none" stroke="#fde68a" stroke-width="2"/><circle cx="26" cy="36" r="3.5" fill="#92400e"/><circle cx="46" cy="36" r="3.5" fill="#92400e"/><path d="M28 47q8 8 16 0" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="19" cy="46" r="4" fill="#fb923c" opacity=".6"/><circle cx="53" cy="46" r="4" fill="#fb923c" opacity=".6"/><text x="36" y="24" font-size="11" text-anchor="middle" fill="#b45309" font-weight="700">$</text></g></g>
 <g class="float" style="animation-delay:1s"><g transform="translate(184,46)"><ellipse cx="36" cy="38" rx="34" ry="28" fill="#fda4af"/><circle cx="20" cy="14" r="8" fill="#fb7185"/><circle cx="52" cy="14" r="8" fill="#fb7185"/><rect x="26" y="9" width="20" height="4" rx="2" fill="#9f1239"/><ellipse cx="66" cy="40" rx="10" ry="8" fill="#fb7185"/><circle cx="63" cy="40" r="1.8" fill="#881337"/><circle cx="69" cy="40" r="1.8" fill="#881337"/><circle cx="48" cy="30" r="3.2" fill="#881337"/><path d="M40 50q6 5 12 0" stroke="#881337" stroke-width="2.2" fill="none" stroke-linecap="round"/><rect x="18" y="60" width="10" height="12" rx="4" fill="#fb7185"/><rect x="46" y="60" width="10" height="12" rx="4" fill="#fb7185"/><path d="M3 34q-8-6-2-14" stroke="#fb7185" stroke-width="3" fill="none" stroke-linecap="round"/></g></g>
 <g class="float" style="animation-delay:1.5s"><g transform="translate(264,28)"><rect width="56" height="80" rx="8" fill="#fff" stroke="#0284c7" stroke-width="3"/><rect width="9" height="80" rx="4" fill="#0284c7"/><path d="M20 62h28M20 70h20" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/><circle cx="29" cy="24" r="3" fill="#0c4a6e"/><circle cx="45" cy="24" r="3" fill="#0c4a6e"/><path d="M31 32q6 6 12 0" stroke="#0c4a6e" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="23" cy="32" r="3.5" fill="#fda4af" opacity=".85"/><circle cx="51" cy="32" r="3.5" fill="#fda4af" opacity=".85"/><path d="M22 50l7-7 7 5 10-11" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg><h3 style="margin-top:0;text-align:center">LOGIN</h3>
 <label>Username</label><input id="u" placeholder="Nama" autocapitalize="none">
 <label>Password</label><input id="p" type="password" onkeydown="if(event.key=='Enter')doLogin()">
 <button style="width:100%" onclick="doLogin()">Masuk</button></div>`}
function doLogin(){const u=$('u').value.trim().toLowerCase(),p=$('p').value;
 if(USERS[u]&&USERS[u].pw===p){me=u;sessionStorage.setItem('me',u);view='me';render();popup('calc','Halo, '+USERS[u].name+'!','Selamat datang!')}
 else popup('book','Ups, salah!','Username atau password belum cocok. Coba lagi ya.')}
function logout(){sessionStorage.removeItem('me');me=null;render()}

// ===== ABSEN =====
let selDate=todayStr();
function setPeriod(v){if(!v)return;period=v;const t=todayStr();selDate=(v==t.slice(0,7))?t:v+'-01';render()}
function pickDate(v){if(!v)return;selDate=v;period=v.slice(0,7);render()}
function absen(s){const k=selDate;if(k>todayStr())return;
 if(rec(me,k)){popup('book','Sudah absen!','Tanggal ini sudah diisi. Absen hanya bisa 1x per tanggal ya.');return}
 let ket='';
 if(s=='A'){ket=$('ket').value.trim();if(!ket){popup('pen','Isi keterangan','Tulis keterangan.');return}}
 if(s=='I'){ket=$('ket').value.trim()}
 setRec(me,k,s,ket);render();
 if(s=='H')popup('coin','Hadir tercatat!');
 if(s=='I')popup('pen','Izin tercatat');
 if(s=='A')popup('book','Alfa tercatat','Keterangan sudah disimpan dan langsung terkirim ke Aldinda.')}
function cycle(u,k){const order=['','H','I','A'];const r=rec(u,k);const n=order[(order.indexOf(r?r.s:'')+1)%4];
 let ket=r?r.k:'';if(n=='A'&&!ket){ket=prompt('Keterangan alfa untuk '+USERS[u].name+':')||'-'}
 setRec(u,k,n,n=='A'?ket:'');render()}

// ===== RENDER =====
const sym={H:'H',I:'I',A:'A'};
function myCard(){
 const k=selDate,t=todayStr(),d=new Date(k+'T00:00:00'),dow=d.getDay(),r=rec(me,k);
 let body='';
 if(dow==0)body=`<p>Minggu libur. Selamat istirahat!</p>`;
 else if(k>t)body=`<p>Tanggal ini belum tiba, jadi belum bisa diisi.</p>`;
 else if(r)body=`<p>Absen tanggal ini: <span class="c c${r.s}">${{H:'Hadir',I:'Izin',A:'Alfa'}[r.s]}</span> (diisi pukul ${r.t})${r.k?`<br><span class="note">Keterangan: ${r.k}</span>`:''}</p>`;
 else body=`${dow==6?'<p class="note">Sabtu libur, jika masuk kerja silakan klik Hadir.</p>':''}
  <label class="note">Keterangan (isi jika izin; wajib jika tidak masuk/alfa)</label>
  <textarea id="ket" rows="2" placeholder="Contoh: sakit, urusan keluarga..."></textarea>
  <div class="row"><button class="b-h" onclick="absen('H')">✅ Hadir</button><button class="b-i" onclick="absen('I')" ${dow==6?'disabled':''}>📝 Izin</button><button class="b-a" onclick="absen('A')" ${dow==6?'disabled':''}>❌ Alfa (isi keterangan)</button></div>`;
 return `<div class="card noprint"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Isi Absen — ${DAYS[dow]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}</h3>
  <div><label class="note">Pilih tanggal</label><input type="date" value="${k}" max="${t}" style="margin:0;width:auto" onchange="pickDate(this.value)"></div></div>${body}</div>`}

function personTable(u){
 const t=totals(u,period);
 const rows=days(period).map(x=>{const r=rec(u,x.key);
  let st=x.dow==0?'<span class="c off">Libur</span>':r?`<span class="c c${r.s}">${{H:'Hadir',I:'Izin',A:'Alfa'}[r.s]}</span>`:(x.dow==6?'<span class="c off">Libur</span>':'-');
  return `<tr class="${x.dow==6?'sat':''}"><td>${x.d} ${DAYS[x.dow]}</td><td>${st}</td><td>${r?r.t:''}</td><td style="text-align:left">${r?r.k:''}</td></tr>`}).join('');
 return `<div class="stats"><div class="stat"><b>${t.H}</b>Hadir</div><div class="stat"><b>${t.I}</b>Izin</div><div class="stat"><b>${t.A}</b>Alfa</div><div class="stat"><b>${t.S}</b>Masuk Sabtu</div><div class="stat"><b>${t.W}</b>Hari Kerja (Sen–Jum)</div></div>
 <div class="scroll"><table><tr><th>Tanggal</th><th>Status</th><th>Jam</th><th>Keterangan</th></tr>${rows}</table></div>`}

function adminTable(){
 const ds=days(period);
 const head=ds.map(x=>`<th style="${x.dow==0?'background:#9ca3af':''}">${x.d}<br><small>${DAYS[x.dow][0]}</small></th>`).join('');
 const rows=Object.keys(USERS).map(u=>{const t=totals(u,period);
  const cells=ds.map(x=>{if(x.dow==0)return `<td class="off">–</td>`;const r=rec(u,x.key);
   return `<td class="edit ${x.dow==6?'sat':''}" title="${r&&r.k?r.k:''}" onclick="cycle('${u}','${x.key}')">${r?`<span class="c c${r.s}">${r.s}</span>`:''}</td>`}).join('');
  return `<tr><td class="name">${USERS[u].name}</td>${cells}<td><b>${t.H}</b></td><td><b>${t.I}</b></td><td><b>${t.A}</b></td><td>${t.S}</td></tr>`}).join('');
 const ket=Object.keys(USERS).flatMap(u=>ds.filter(x=>rec(u,x.key)&&rec(u,x.key).k).map(x=>`<tr><td>${USERS[u].name}</td><td>${x.d} ${MONTHS[+period.slice(5)-1]}</td><td><span class="c c${rec(u,x.key).s}">${rec(u,x.key).s}</span></td><td style="text-align:left">${rec(u,x.key).k}</td></tr>`)).join('');
 return `<div class="scroll"><table><tr><th>Nama</th>${head}<th>H</th><th>I</th><th>A</th><th>Sabtu</th></tr>${rows}</table></div>
 <p class="note">H = Hadir, I = Izin, A = Alfa. Minggu libur, Sabtu libur (tetap dihitung hadir bila masuk). Klik kotak untuk mengubah status (kosong → H → I → A).</p>
 ${ket?`<h4>Daftar Keterangan</h4><div class="scroll"><table><tr><th>Nama</th><th>Tanggal</th><th>Status</th><th>Keterangan</th></tr>${ket}</table></div>`:''}`}

function render(){
 if(!me||!USERS[me]){loginPage();return}
 const admin=USERS[me].admin;
 const tabs=admin?`<div class="tabs noprint"><button class="${view=='me'?'on':''}" onclick="view='me';render()">Absen Saya</button><button class="${view=='all'?'on':''}" onclick="view='all';render()">Rekap Semua Karyawan</button>${Object.keys(USERS).filter(u=>u!=me).map(u=>`<button class="${view==u?'on':''}" onclick="view='${u}';render()">${USERS[u].name}</button>`).join('')}</div>`:'';
 let target=view=='all'?null:(view=='me'||!admin?me:view);
 const title=view=='all'&&admin?'Rekap Absensi Seluruh Karyawan':'Absensi '+USERS[target].name;
 $('app').innerHTML=`<div class="top noprint"><div>Login sebagai <b>${USERS[me].name}</b>${admin?' (Pusat)':''}</div>
  <div class="row"><input type="month" id="per" value="${period}" style="margin:0;width:auto" onchange="setPeriod(this.value)"><button onclick="window.print()">🖨️ Cetak / Simpan PDF</button><button class="b-g" onclick="logout()">Keluar</button></div></div>
  ${tabs}${(view=='me'||!admin)?myCard():''}
  <div class="card"><div class="printhead"><h1 class="brand">Absensi KAP TENDY WATO &amp; IFEN TJHAI</h1></div>
  <h3 style="margin-top:0">${title} — ${label(period)}</h3>${view=='all'&&admin?adminTable():personTable(target)}</div>`}
render();
// sinkron antar tab di browser yang sama
window.addEventListener('storage',e=>{if(e.key==KEY){db=JSON.parse(e.newValue);render()}});

// ===== SPLASH PEMBUKA =====
const vals=['1.250','12.500','87.350','250.000','1.000.000'];let vi=0;
const scrT=setInterval(()=>{const e=document.getElementById('scr');if(e){e.textContent=vals[vi++%vals.length]}},650);
function closeSplash(){clearInterval(scrT);document.getElementById('splash').classList.add('hide')}
setTimeout(closeSplash,5500);
</script>
</body>
</html>
